name: Imperium — Auto-Agent

on:
  schedule:
    - cron: '0 3 * * *'   # 3 AM UTC nightly
  workflow_dispatch:

jobs:
  auto-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git
        run: |
          git config --global user.email "agent@omni-ai.com"
          git config --global user.name "Omni Auto-Agent"

      - name: The agent needs an API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set in this repository's Actions secrets."
            echo "The agent cannot run without it. Add it under Settings -> Secrets and variables -> Actions, then re-run this workflow."
            exit 1
          fi

      - name: Run Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd ..
          claude --print --dangerously-skip-permissions \
            "Read CLAUDE.md and complete all Agent Priorities. Run 'cd web && npm run build' to verify. Commit with prefix 'agent:'. Never touch .env files.
            The production root is Website/ and web/ is a byte-identical mirror of it. Make every change in Website/, and write the intelligence brief to Website/AGENT_MEMORY.md. If you edited web/ instead, copy the change into Website/ before mirroring. Run scripts/sync-trees.sh so the two trees are identical, and never let the two trees differ."

      - name: Keep the mirror in step with the production root
        working-directory: .
        run: |
          scripts/sync-trees.sh
          scripts/sync-trees.sh --check
          if [ -n "$(git status --porcelain -- web/)" ]; then
            git add web/
            git commit -m "agent: mirror the production root into web/"
          fi

      - name: Push changes
        run: git push origin HEAD || echo "No changes to push"
